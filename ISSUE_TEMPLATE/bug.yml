name: Bug report
description: Report reproducible behavior that does not match the documented contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Keep the report focused, reproducible, and free of secrets.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem and why it is incorrect.
      placeholder: A clear description of the failure.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the expected contract or result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output, logs, or screenshots. Remove credentials and private data.
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Identify the affected 0xda-market repository.
      placeholder: 0xda-market/0xda-market
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Provide a release, branch, or commit SHA when known.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include runtime, operating system, deployment target, and other relevant versions.

  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed secrets, tokens, credentials, and private data from this report.
          required: true
